<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>FastMD document spacing test</title>
<link rel="stylesheet" href="preview.css">
<script>
  // Stub the WebView2 host bridge so preview.js takes its normal host path and
  // we can drive real 'spacing' and 'content' messages at it.
  (function () {
    window.requestAnimationFrame = function (fn) { return setTimeout(function () { fn(performance.now()); }, 0); };
    window.cancelAnimationFrame = function (id) { clearTimeout(id); };
    var listeners = [];
    window.__posted = [];
    window.chrome = {
      webview: {
        addEventListener: function (t, fn) { if (t === 'message') listeners.push(fn); },
        postMessage: function (o) { window.__posted.push(o); }
      }
    };
    window.__send = function (msg) {
      listeners.forEach(function (fn) { fn({ data: msg }); });
    };
  })();
</script>
</head>
<body>
<div id="content"></div>
<button id="outline-btn" type="button" title="Outline"><span id="outline-btn-label">Outline</span></button>
<script src="preview.js"></script>
<script src="spacingtest.js"></script>
</body>
</html>
